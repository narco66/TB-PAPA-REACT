name: Security

on:
  schedule:
    - cron: '0 6 * * 1' # Tous les lundis à 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composer.lock'
      - 'package-lock.json'

jobs:
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies (no scripts)
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --abandoned=report --format=plain

  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: NPM audit (modérées et plus)
        run: npm audit --audit-level=moderate
        continue-on-error: true
